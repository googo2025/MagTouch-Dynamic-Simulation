name: Deploy MagTouch simulation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static resources
        run: python3 tools/verify_static_site_r385.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/magnetic-forward-r361
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
